name: Build and test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @ef/api test
