name: empreinteflex2
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 35s
      interval: 12s
      timeout: 4s
      retries: 10
    networks: [private]
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["node", "apps/api/dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
  storefront:
    build:
      context: .
      dockerfile: infra/Dockerfile.storefront
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000
      STAFF_PUBLIC_URL: ${STAFF_PUBLIC_URL:-http://localhost:8081}
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
  staff:
    build:
      context: .
      dockerfile: infra/Dockerfile.staff
    restart: unless-stopped
    networks: [private]
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile.production.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - storefront
      - staff
    networks: [private]
networks:
  private: {}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
